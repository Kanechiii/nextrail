[project]
name = "nextrail-api"
version = "0.1.0"
description = "Nextrail backend API and learning intelligence"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
