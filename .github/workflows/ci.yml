name: Repository Validation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate repository foundations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "uvicorn>=0.30,<1"
      - name: Validate repository structure
        run: python scripts/validate_repository.py
      - name: Validate Python syntax
        run: python -m py_compile scripts/validate_repository.py
      - name: Verify Node.js runtime
        run: node --version
      - name: Validate catalog contracts
        run: python scripts/validate_catalog.py
      - name: Test complete repository
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Validate discovery fixtures and adapters
        run: python scripts/validate_discovery.py
      - name: Compile backend modules
        run: python -m compileall -q services/api/nextrail_ai services/api/nextrail_discovery services/api/nextrail_orchestration services/api/nextrail_evidence services/api/nextrail_storage services/api/nextrail_auth services/api/nextrail_api
