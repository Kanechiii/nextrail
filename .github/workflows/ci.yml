name: Repository Validation
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Validate repository foundations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "uvicorn>=0.30,<1"
      - name: Validate repository structure
        run: python scripts/validate_repository.py
      - name: Validate Python syntax
        run: python -m py_compile scripts/validate_repository.py
      - name: Verify Node.js runtime
        run: node --version
      - name: Validate catalog contracts
        run: python scripts/validate_catalog.py
      - name: Test backend security and contracts
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Evaluate deterministic pathway quality
        run: python scripts/evaluate_pathways.py
      - name: Evaluate offline guest API reliability smoke budget
        run: python scripts/evaluate_api_reliability.py --iterations 12 --max-p95-ms 3000
      - name: Evaluate offline SQLite concurrency and lock recovery
        run: python scripts/evaluate_storage_concurrency.py --workers 4 --steps 3
      - name: Validate discovery fixtures and adapters
        run: python scripts/validate_discovery.py
      - name: Verify offline source authorization preflight
        run: python scripts/verify_source_authorizations.py --sources data/sources.sample.json --authorizations data/provider-authorizations.sample.json
      - name: Verify pre-release acceptance is blocked without evidence
        run: python scripts/verify_pre_release_acceptance.py --manifest data/pre-release-acceptance.sample.json --expect-blocked
      - name: Confirm desktop/mobile UI acceptance remains blocked without review
        run: python scripts/verify_ui_quality.py --manifest data/ui-quality-acceptance.sample.json --expect-blocked
      - name: Compile backend modules
        run: python -m compileall -q services/api/nextrail_ai services/api/nextrail_discovery services/api/nextrail_orchestration services/api/nextrail_evidence services/api/nextrail_storage services/api/nextrail_auth services/api/nextrail_api
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Test web experience
        working-directory: apps/web
        run: npm test
      - name: Typecheck and build frontend
        working-directory: apps/web
        run: npm run build
